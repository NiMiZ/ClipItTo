# ClipItTo configuration: copy to ~/.config/clipitto/config.toml.
# Apply changes with `clipitto --reload` (or `systemctl --user reload clipitto`).

max_history = 1000          # unsaved items kept; pinned, starred and grouped items are never pruned
recent_count = 20           # recent copies shown when the search box is empty
preview_lines = 1           # text lines shown per copy (1 = the whole text squeezed on one line)
show_saved_on_top = true    # list pinned copies (Ctrl+P, up to 10) above recent copies
saved_cap = 15              # at most this many pinned copies in that list
favorites_limit = 10        # starred copies without a group, shown in Favorites (1-20);
                            # a group holds up to 10 starred copies, listed first
max_item_bytes = 1048576    # larger copies are not recorded
max_images = 100            # unsaved pictures kept (on top of max_history); 0 = don't record
                            # pictures. Pinned, starred and grouped pictures are always kept
ocr_languages = ""          # languages "Paste text from picture" reads, e.g. "en, he" or "eng+heb"; empty =
                            # automatic (Windows: the languages installed for your account; macOS: detected;
                            # Linux: English plus your locale's language, if its data is installed)
keyboard_layouts = ""       # Paste as… "keyboard layout": text typed with the wrong layout, converted key for key
                            # (xccv -> סבבה). he | ru | el, several allowed ("he, ru"); empty = the layout of your
                            # system language, if there is one; "none" = off
index_pictures = true       # read the text in copied pictures (offline), so a search finds a picture by it
keep_formatting = true      # also keep the formatted (HTML) version of a copy with bold, links, tables...
                            # for Paste as... > "With formatting"; false = plain text only, and deletes the stored ones
paste_as_text = ""          # items of the Paste as... menu for text, in order, "-" in front hides one:
                            # "upper,-lower,title"; empty = all of them, in the built-in order
paste_as_picture = ""       # the same for pictures
paste_as_others = true      # the Paste as... menu ends with "Others", which holds the items left unticked
                            # (the item "once", Paste once, is one of the items: shown, under Others, or hidden, and where)
translate_timeout = 5       # seconds (1-10) a translation may take before it is cancelled
max_image_bytes = 52428800  # larger pictures (50 MB as PNG) are not recorded
capture_primary = false     # also record the primary (mouse-selection) clipboard, where supported
paste_on_enter = true       # choosing a copy (Enter or click) also pastes it into the window
                            # you came from; false = only put it on the clipboard
latest_after_paste = true   # a copy chosen in ClipItTo becomes the latest in the history,
                            # as if you had copied it again; false = it keeps its place.
                            # Starred, pinned and grouped copies always keep their place
paste_keys = "ctrl+v"       # ctrl+v | shift+insert; for programs no rule below names
paste_keys_per_app = true   # type the keys the program you came from wants: well-known terminals
                            # get ctrl+shift+v (Windows consoles shift+insert). Needs the platform to
                            # name that program: Windows, X11, GNOME Wayland with the ClipItTo
                            # extension. Not macOS (always Cmd+V) nor other Wayland desktops, where
                            # paste_keys is used for every program
paste_keys_apps = []        # your own rules, tried first, up to 16: ["program = keys"], e.g.
                            # ["WindowsTerminal.exe = ctrl+shift+v", "Code = ctrl+shift+v"].
                            # program: executable name (Windows), window class (X11) or app id,
                            # any letter case, "*" matches any text. keys: ctrl+v | shift+insert |
                            # ctrl+shift+v
click_to_copy = "single"    # single | double
hide_on_focus_loss = true
search_debounce_ms = 100
backend = "auto"            # auto | gnome-ext | wl-paste | qt-clipboard
hotkey = "Ctrl+Alt+V"       # shortcut that opens the popup, e.g. "Ctrl+`". Windows: ClipItTo
                            # registers it. GNOME: changing it in Settings updates the GNOME
                            # custom shortcut. macOS: ClipItTo registers it; the default there is "Alt+Cmd+V" (⌘⌥V),
                            # and Cmd is the ⌘ key. Other desktops: bind `clipitto --toggle` yourself.
theme = "system"            # system | light | dark
popup_position = "cursor"   # cursor | center | top-left | top-right | bottom-left |
                            # bottom-right | last (where it last closed, e.g. after dragging
                            # it by its name). X11, Windows and macOS; on Wayland the desktop places it
start_focus = "pinned"      # where the selection starts when the popup opens and after a search:
                            # pinned (first pinned copy) | grouped (first copy in a group) |
                            # unsaved (first copy that isn't pinned, starred or grouped);
                            # the first copy when there is none of that kind
ignore_case = false          # "ABC" and "abc" are one copy; the one copied last is kept
encrypt_history = false     # encrypt history.db; the key is kept in the system keyring

# Password copies: copies a password manager marks as secret (KeePassXC, Bitwarden, KeePass,
# 1Password, ...) are kept encrypted once a master password is set in Settings > Passwords,
# shown as ●●●● and opened only after an unlock. The master password itself is never stored.
keep_passwords = true       # false = skip them, as without a master password
passwords_in_group = true   # put new password copies in the "Passwords" group
                            # (false: only in the group and in the p[] search)
detect_secrets = true       # a copy that looks like an API key, token, private key or card number is
                            # kept as a password copy too (once a master password is set)
detect_passwords = false    # a single-line copy that looks like a generated password (8-64 characters,
                            # no spaces, three of lower/upper/digits/symbols) is kept as a password
                            # copy too. A guess: it can take ordinary text, so it is off by default
password_rules = []         # your own rules for what is kept as a password copy, up to 5, added to
                            # the detection above. Each is "min-max" length plus minimum counts, e.g.
                            # ["8-20 lower=1 upper=1 digits=2 symbols=0 end"]: 8 to 20 characters, at
                            # least 1 lower case, 1 upper case, 2 digits, and ending with a digit
                            # (omit "end" for no such condition; counts default to 0)
passwords_per_note = true  # the same password under a different note is kept as a separate copy
password_ask_note = true    # after copying a new password, open ClipItTo with a name box on it
                            # (the app it came from is suggested)
auto_group = false         # true = a new copy that clearly matches one of your groups (learned from the copies you
                            # put there) is filed in it, marked "auto"; never creates a group, never for passwords
                            # or pictures. Settings > Groups can forget what was learned
debug_log = false          # true = write a diagnostic log file for troubleshooting (what ClipItTo does, never what you
                            # copied); false deletes it. The daemon's --verbose does the same for one run
password_unlock_minutes = 5 # how long an unlock lasts (1-240)
password_clear_seconds = 2  # a password pasted from ClipItTo leaves the clipboard this many seconds
                            # after the paste (0-60), but only if the clipboard still holds it:
                            # something copied meanwhile stays; 0 = it stays. Also cleared at quit
paste_once_clear_seconds = 2 # a "Paste once" copy leaves the clipboard this many seconds after its paste
                            # (0-60), only if the clipboard still holds it; 0 = it stays. The copy itself
                            # is removed from the history right after the paste. Also cleared at quit
auto_forget = []            # copies that remove themselves, quietly (up to 8 rules; none = nothing is
                            # removed). Pinned, starred, grouped and password copies are never removed.
                            # ["age 30d", "age 1d picture", "age 7d text"]: older than that (last used)
                            # ["match 5m token"]: a copy that looks like an access token, 5 minutes after
                            #   it was copied; also key, card (a card number) and secret (any of them)
                            # ["match 5m contains \"Bearer \""]: text containing that (any letter case)
                            # (by program is not possible yet: the source app is not stored)
windows_hello = false       # Windows / macOS: unlock with Windows Hello / Touch ID too (set up in Settings)
password_search_keyword = "p[]" # type it with a space after it to search inside passwords;
                            # what follows is shown as asterisks
lock_on_screen_lock = true   # lock the passwords when the screen locks or the PC sleeps (Windows, macOS, Linux
                            # with systemd-logind or GNOME/KDE screensaver); false = only the timer and Lock now
panic_key = false           # PANIC KEY, off by default. true = the shortcut below works. Pressing it wipes the
                            # history (like "Clear everything, also in groups"), locks the passwords and empties
                            # the system clipboard, at once and WITHOUT asking. `clipitto --panic` always works
panic_hotkey = ""           # the panic shortcut, e.g. "Ctrl+Alt+Shift+Delete"; empty = none. It must differ from
                            # `hotkey`. Windows/macOS: ClipItTo registers it. GNOME: a second custom shortcut
                            # (removed again when the key is off). Other desktops: bind "clipitto --panic" yourself
