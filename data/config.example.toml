# ClipItTo configuration: copy to ~/.config/clipitto/config.toml.
# Apply changes with `clipitto --reload` (or `systemctl --user reload clipitto`).

max_history = 1000          # unsaved items kept; pinned, starred and grouped items are never pruned
recent_count = 20           # recent copies shown when the search box is empty
preview_lines = 1           # text lines shown per copy (1 = the whole text squeezed on one line)
show_saved_on_top = true    # list pinned copies (Ctrl+P, up to 10) above recent copies
saved_cap = 15              # at most this many pinned copies in that list
favorites_limit = 10        # starred copies without a group, shown in Favorites (1-20);
                            # a group holds up to 10 starred copies, listed first
max_item_bytes = 1048576    # larger copies are not recorded
max_images = 100            # unsaved pictures kept (on top of max_history); 0 = don't record
                            # pictures. Pinned, starred and grouped pictures are always kept
max_image_bytes = 52428800  # larger pictures (50 MB as PNG) are not recorded
capture_primary = false     # also record the primary (mouse-selection) clipboard, where supported
paste_on_enter = true       # choosing a copy (Enter or click) also pastes it into the window
                            # you came from; false = only put it on the clipboard
latest_after_paste = true   # a copy chosen in ClipItTo becomes the latest in the history,
                            # as if you had copied it again; false = it keeps its place.
                            # Starred, pinned and grouped copies always keep their place
paste_keys = "ctrl+v"       # ctrl+v | shift+insert (terminals)
click_to_copy = "single"    # single | double
hide_on_focus_loss = true
search_debounce_ms = 100
backend = "auto"            # auto | gnome-ext | wl-paste | qt-clipboard
hotkey = "Ctrl+Alt+V"       # shortcut that opens the popup, e.g. "Ctrl+`". Windows: ClipItTo
                            # registers it. GNOME: changing it in Settings updates the GNOME
                            # custom shortcut. macOS: ClipItTo registers it; the default there is "Alt+Cmd+V" (⌘⌥V),
                            # and Cmd is the ⌘ key. Other desktops: bind `clipitto --toggle` yourself.
theme = "system"            # system | light | dark
popup_position = "cursor"   # cursor | center | top-left | top-right | bottom-left |
                            # bottom-right | last (where it last closed, e.g. after dragging
                            # it by its name). X11 and Windows; Wayland desktops place it
start_focus = "pinned"      # where the selection starts when the popup opens and after a search:
                            # pinned (first pinned copy) | grouped (first copy in a group) |
                            # unsaved (first copy that isn't pinned, starred or grouped);
                            # the first copy when there is none of that kind
ignore_case = false          # "ABC" and "abc" are one copy; the one copied last is kept
encrypt_history = false     # encrypt history.db; the key is kept in the system keyring

# Password copies: copies a password manager marks as secret (KeePassXC, Bitwarden, KeePass,
# 1Password, ...) are kept encrypted once a master password is set in Settings > Passwords,
# shown as ●●●● and opened only after an unlock. The master password itself is never stored.
keep_passwords = true       # false = skip them, as without a master password
passwords_in_group = false  # put new password copies in the "Passwords" group
                            # (false: only in the group and in the p[] search)
passwords_per_note = false  # the same password under a different note is kept as a separate copy
password_ask_note = false   # after copying a new password, open ClipItTo with a name box on it
                            # (the app it came from is suggested)
password_unlock_minutes = 5 # how long an unlock lasts (1-240)
password_clear_seconds = 30 # a password pasted from ClipItTo leaves the clipboard after this
                            # (unless something else was copied meanwhile); 0 = it stays
windows_hello = false       # Windows / macOS: unlock with Windows Hello / Touch ID too (set up in Settings)
password_search_keyword = "p[]" # type it with a space after it to search inside passwords;
                            # what follows is shown as asterisks
