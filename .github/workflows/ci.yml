name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or tag cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ubuntu 24.04, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build qt6-base-dev qt6-qpa-plugins libgl-dev \
            libsqlite3-dev libtomlplusplus-dev libx11-dev libxtst-dev libglib2.0-bin qtkeychain-qt6-dev dbus gjs

      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan

      - name: Build and test without D-Bus (Windows transport on Linux)
        run: |
          cmake -S . -B build/nodbus -G Ninja -DCLIPITTO_DBUS=OFF -DCLIPITTO_WERROR=ON
          cmake --build build/nodbus
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/nodbus --output-on-failure

  package:
    name: Debian package (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build qt6-base-dev libgl-dev libsqlite3-dev libtomlplusplus-dev \
            libx11-dev libxtst-dev libglib2.0-bin qtkeychain-qt6-dev dpkg-dev desktop-file-utils

      - name: Build
        run: cmake --preset deb && cmake --build --preset deb
      - name: Package
        working-directory: build/deb
        run: cpack
      - name: Inspect
        run: |
          dpkg-deb -I build/deb/clipitto_*.deb
          dpkg-deb -c build/deb/clipitto_*.deb
          desktop-file-validate data/io.github.nimiz.ClipItTo.desktop

      # What a user who downloads the .deb gets: install it with apt (which pulls the
      # runtime libraries from its Depends) and run the installed binaries.
      - name: Install the package and run it
        timeout-minutes: 10
        run: |
          timeout 300 sudo apt-get install -y ./build/deb/clipitto_*.deb ||
            { echo "::error title=installed package::apt-get install failed or timed out"; exit 1; }
          clipitto --version
          export QT_QPA_PLATFORM=offscreen
          # Bounded: a daemon that doesn't answer or doesn't quit fails here instead of hanging.
          if ! timeout 90 dbus-run-session -- sh -euc '
            clipitto-daemon > daemon.log 2>&1 & daemon=$!
            echo "step: waiting for the daemon" > step.txt
            for i in $(seq 50); do clipitto --status >/dev/null 2>&1 && break; sleep 0.2; done
            echo "step: ingest" > step.txt
            clipitto --ingest "hello from the installed package"
            status=$(clipitto --status); echo "$status" | tee status.txt
            echo "$status" | grep -qx "items: 1"
            echo "step: quit" > step.txt
            clipitto --quit
            wait $daemon
          '; then
            echo "::error title=installed package::$(cat step.txt status.txt daemon.log 2>/dev/null | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: clipitto-deb
          path: build/deb/clipitto_*.deb

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: win64_msvc2019_64
          cache: true

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Point the preset at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows
      - name: Test
        shell: pwsh
        run: |
          $out = ctest --preset windows --output-on-failure 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            # The failing checks as an annotation, readable without opening the log: run the
            # failed suites again verbosely and keep their failure lines (or their last lines).
            # Everything a failed suite printed in the first run (up to its "***Failed" line).
            $all = @($out -split "`r?`n")
            $first = @()
            for ($i = 0; $i -lt $all.Count; $i++) {
              if ($all[$i] -match '\*\*\*(Failed|Exception)') {
                $start = $i
                while ($start -gt 0 -and $all[$start - 1] -notmatch 'Test +#\d+:') { $start-- }
                $first += @($all[[Math]::Max($start, $i - 40)..$i] | Where-Object { $_.Trim() })
              }
            }
            $rerun = (ctest --preset windows --rerun-failed --output-on-failure -V 2>&1 | Out-String) -split "`r?`n"
            $lines = @('--- first run ---') + $first + @('--- rerun ---')
            $lines += @($rerun | Where-Object { $_ -match 'FAIL!|Loc:|Actual|Expected|QWARN|QFATAL|\*\*\*Exception' } | Select-Object -First 30)
            # Run each failed test program directly too: a crash or a missing DLL prints nothing,
            # so its exit code (in hex) is the clue.
            foreach ($command in ($rerun | Select-String -Pattern 'Test command: (.+\.exe)' | ForEach-Object { $_.Matches[0].Groups[1].Value })) {
              Push-Location build\windows\tests
              $log = Join-Path $env:RUNNER_TEMP 'failed-test.txt'
              Remove-Item $log -ErrorAction SilentlyContinue
              $env:QT_QPA_PLATFORM = 'offscreen' # as ctest runs it
              & $command -v2 -o "$log,txt" 2>&1 | Out-Null
              Remove-Item Env:QT_QPA_PLATFORM
              $direct = if (Test-Path $log) { Get-Content $log -Raw } else { 'no log written' }
              $code = $LASTEXITCODE
              Pop-Location
              $lines += ('{0} exited with 0x{1:X8}' -f (Split-Path $command -Leaf), $code)
              $directLines = @(($direct -split "`r?`n") | Where-Object { $_.Trim() })
              $lines += @($directLines | Where-Object { $_ -match 'FAIL!|Loc:|Actual|Expected|QFATAL|Totals' } | Select-Object -First 20)
              $lines += '--- end of its log (a crash stops it here) ---'
              $lines += @($directLines | Select-Object -Last 12)
            }
            Write-Host "::error title=Windows tests failed::$(($lines -join '%0A') -replace '::', ': :')"
            exit 1
          }

      - name: Stage (windeployqt)
        shell: pwsh
        run: |
          # Qt's deploy script needs an absolute prefix.
          $log = cmake --install build/windows --prefix "$PWD\stage" 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) {
            # Surface the error as an annotation (readable without opening the log).
            $tail = ($log -split "`r?`n" | Select-Object -Last 40) -join '%0A'
            Write-Host "::error title=cmake --install failed::$tail"
            exit 1
          }

      - name: Smoke test the staged app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:CLIPITTO_SERVER_NAME = "clipitto-ci"
          $daemon = Start-Process stage\bin\clipitto-daemon.exe -PassThru
          Start-Sleep -Seconds 3
          stage\bin\clipitto.exe --ingest "hello from CI"
          $status = stage\bin\clipitto.exe --status
          $status
          if ($LASTEXITCODE -ne 0 -or -not ($status -match '^items: 1$')) {
            Write-Host "::error title=smoke test::unexpected status: $($status -join '%0A')"
            exit 1
          }
          # The global hotkey reports its state (registered, or why not), and settings live
          # in the roaming profile (%APPDATA%).
          $hotkey = $status | Where-Object { $_ -like 'hotkey: *' } | Select-Object -First 1
          $config = $status | Where-Object { $_ -like 'config: *' } | Select-Object -First 1
          if (-not $hotkey) { Write-Host "::error title=smoke test::no hotkey line in --status"; exit 1 }
          if (-not $config) { Write-Host "::error title=smoke test::no config line in --status"; exit 1 }
          $config = $config -replace '^config: ', ''
          $appdata = [IO.Path]::GetFullPath($env:APPDATA).TrimEnd('\') + '\'
          if (-not [IO.Path]::GetFullPath($config).StartsWith($appdata, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Host "::error title=smoke test::config not under APPDATA: $config"; exit 1
          }
          Write-Host "hotkey line: $hotkey"; Write-Host "config: $config"
          stage\bin\clipitto.exe --quit
          if (-not $daemon.WaitForExit(10000)) { $daemon.Kill(); throw "daemon did not quit" }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          # The version comes from project(... VERSION x.y.z) in CMakeLists.txt.
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          if (-not $version) { Write-Host "::error title=installer::no VERSION in CMakeLists.txt"; exit 1 }
          $log = & $iscc /DStageDir="$PWD\stage" /DOutputDir="$PWD\installer" /DAppVersion=$version packaging\windows\clipitto.iss 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ($log -split "`r?`n" | Select-Object -Last 30) -join '%0A'
            Write-Host "::error title=iscc failed::$tail"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: clipitto-windows-installer
          path: installer/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: clipitto-windows-portable
          path: stage

  # Pushing a tag such as v0.1.0 publishes a GitHub Release with the Ubuntu .deb and the
  # Windows installer, once both were built and tested above.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, package, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: clipitto-{deb,windows-installer}
          merge-multiple: true
      - name: Add the install scripts and SHA256SUMS
        working-directory: dist
        run: |
          cp ../install.sh ../install.ps1 .
          sha256sum *.deb *.exe install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.exe
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Install a published release the way the README tells users to, on fresh machines. On a
  # tag: the release just published, with the scripts attached to it. On other pushes: this
  # commit's scripts, installing the latest release (so script changes are tested too).
  release-check-linux:
    name: Install the release (Ubuntu)
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install with install.sh
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" -o install-release.sh
            set -- install-release.sh --version "$GITHUB_REF_NAME"
          else
            set -- install.sh
          fi
          if ! sh "$@" > install.log 2>&1; then
            cat install.log
            echo "::error title=install.sh failed::$(tail -n 25 install.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat install.log
      - name: Run the installed app
        timeout-minutes: 5
        run: |
          clipitto --version
          export QT_QPA_PLATFORM=offscreen
          if ! timeout 90 dbus-run-session -- sh -euc '
            clipitto-daemon > daemon.log 2>&1 & daemon=$!
            for i in $(seq 50); do clipitto --status >/dev/null 2>&1 && break; sleep 0.2; done
            clipitto --ingest "hello from the release"
            clipitto --status | tee status.txt | grep -qx "items: 1"
            clipitto --quit
            wait $daemon
          '; then
            echo "::error title=installed app::$(cat status.txt daemon.log 2>/dev/null | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

  release-check-windows:
    name: Install the release (Windows)
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install with install.ps1 and run it
        timeout-minutes: 10
        shell: pwsh
        run: |
          # The real Windows platform, as users run it: the installer ships only that plugin.
          try {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $script = Invoke-RestMethod "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1"
              & ([scriptblock]::Create($script)) -Version $env:GITHUB_REF_NAME
            } else {
              & .\install.ps1
            }
            $app = Join-Path $env:LOCALAPPDATA 'Programs\ClipItTo\bin'
            if (-not (Test-Path "$app\clipitto.exe")) { throw "not installed under $app" }
            $startup = [Environment]::GetFolderPath('Startup')
            if (-not (Test-Path "$startup\ClipItTo.lnk")) { throw "no sign-in shortcut in $startup" }
            $up = $false
            foreach ($i in 1..25) {
              & "$app\clipitto.exe" --status *> $null
              if ($LASTEXITCODE -eq 0) { $up = $true; break }
              Start-Sleep -Milliseconds 400
            }
            if (-not $up) {
              # Start it again with Qt's messages on stderr (a GUI program has no console), to see why.
              Get-Process clipitto-daemon -ErrorAction SilentlyContinue | Stop-Process -Force
              $env:QT_FORCE_STDERR_LOGGING = '1'
              $err = Join-Path $env:RUNNER_TEMP 'daemon-stderr.txt'
              $daemon = Start-Process "$app\clipitto-daemon.exe" -PassThru -RedirectStandardError $err
              Start-Sleep -Seconds 6
              & "$app\clipitto.exe" --status *> $null
              $answered = $LASTEXITCODE -eq 0
              if (-not $daemon.HasExited) { $daemon | Stop-Process -Force }
              $log = if (Test-Path $err) { (Get-Content $err | Select-Object -Last 15) -join ' / ' } else { 'no stderr' }
              throw "the installed daemon did not answer (after a restart: $answered). Its messages: $log"
            }
            & "$app\clipitto.exe" --ingest "hello from the release"
            $status = & "$app\clipitto.exe" --status
            $status
            if (-not ($status -match '^items: 1$')) { throw "unexpected status: $($status -join ' | ')" }
            & "$app\clipitto.exe" --quit
          } catch {
            $where = $_.InvocationInfo.PositionMessage -replace "`r?`n", ' '
            Write-Host "::error title=install.ps1 check failed::$($_.Exception.Message) -- $where"
            exit 1
          }
